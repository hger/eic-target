image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: "latest"
auth:
  postgresPassword: "mysecretpassword"
  username: "app_user"
  password: "mysecretpassword"
  database: "app_db"

architecture: standalone

primary:
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi