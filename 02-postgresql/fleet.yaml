defaultNamespace: postgresql

targetCustomizations:
  - name: dynamic-downstream-targets
    clusterSelector:
      matchLabels:
        environment: eic-target

dependsOn:
  - name: eic-target-01-namespaces

helm:
  repo: https://charts.bitnami.com/bitnami
  chart: postgresql
  version: 15.5.38
  releaseName: postgresql
  namespace: postgresql
  valuesFiles:
    - values.yaml
  waitForData: true
