targetCustomizations:
  - name: dynamic-downstream-targets
    clusterSelector:
      matchLabels:
        environment: downstream-target

helm:
  repo: https://metallb.github.io/metallb
  chart: metallb
  version: 0.14.8
  releaseName: metallb
  namespace: metallb-system
  createNamespace: true
  valuesFiles:
    - values.yaml

options:
  forceSync: false
  disableReadyCheck: false
diff:
  skip: true