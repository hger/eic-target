# Target definition for the Helm Chart
targetCustomizations:
  - name: dynamic-downstream-targets
    clusterSelector:
      matchLabels:
        environment: downstream-target

# Helm chart details
helm:
  repo: https://metallb.github.io/metallb
  chart: metallb
  version: 0.14.8
  releaseName: metallb
  namespace: metallb-system
  createNamespace: true
  valuesFiles:
    - values.yaml

# ⬇️ ADD THIS SECTION TO FIX THE "MODIFIED" DRIFT ⬇️
diff:
  comparePatches:
    - apiVersion: metallb.io/v1beta1  # Verify if your version is v1beta1 or v1beta2 based on your CRD
      kind: BGPPeer
      operations:
        - {"op": "remove", "path": "/status"}
        - {"op": "remove", "path": "/metadata/annotations"}