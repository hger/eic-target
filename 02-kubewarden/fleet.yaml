defaultNamespace: cattle-kubewarden-system

targetCustomizations:
  - name: dynamic-downstream-targets
    clusterSelector:
      matchLabels:
        environment: eic-target

dependsOn:
  - name: eic-target-01-namespaces

helm:
  repo: https://dp.apps.rancher.io/charts
  chart: suse-security-admission-controller
  version: 1.0.2
  releaseName: suse-security-admission-controller
  namespace: cattle-kubewarden-system
  valuesFiles:
    - values.yaml
  waitForData: true

options:
  install:
    createNamespace: false